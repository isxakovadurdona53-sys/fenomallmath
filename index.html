quad:d=>{let r1,r2;do{r1=R(-4,3+d);r2=r1+R(1,6)}while(r1+r2==0||r1*r2==0);return N(`x² ${sg(-(r1+r2))}x ${sg(r1*r2)} = 0. ${L('Больший корень','Katta ildiz')} = ?`,r2)},

trig:d=>{const v=[['sin 30°','1/2'],['cos 60°','1/2'],['sin 90°','1'],['cos 0°','1'],['tg 45°','1'],['sin 0°','0'],['cos 90°','0'],['sin 45°','√2/2'],['cos 30°','√3/2'],['tg 60°','√3']][R(0,9)];return X(`${v[0]} = ?`,v[1],['0','1/2','1','√2/2','√3/2','√3'])},
log:d=>{const b=R(2,5),k=R(2,4+d);if(R(0,1))return N(`log${sub(b)}(${b**k}) = ?`,k);const p=R(1,3),q=R(1,3);return N(`log${sub(b)}(${b**p}) + log${sub(b)}(${b**q}) = ?`,p+q)},
comb:d=>{const n=R(4,6+2*d);if(R(0,1)){const k=R(2,3);return N(`C(${n}, ${k}) = ?`,fa(n)/(fa(k)*fa(n-k)))}const m=R(3,6);return N(`${m}! = ?`,fa(m))},
prob:d=>{const r=R(1,6),b=R(1,6),g=gcd(r,r+b),c=`${r/g}/${(r+b)/g}`,w=new Set();while(w.size<3){const m=R(2,12),f=`${R(1,m-1)}/${m}`;if(f!==c)w.add(f)}return mk(L(`В урне ${r} красных и ${b} синих шаров. P(красный) = ?`,`Qutida ${r} qizil va ${b} ko‘k shar. P(qizil) = ?`),c,[...w])},
vol:d=>{const k=R(0,2);if(k==0){const r=R(2,5),h=R(2,8);return N(`${L('Цилиндр','Silindr')}: r=${r}, h=${h}. V = ?`,r*r*h,'π')}if(k==1){const r=R(2,6),h=3*R(1,4);return N(`${L('Конус','Konus')}: r=${r}, h=${h}. V = ?`,r*r*h/3,'π')}const m=R(1,2);return N(`${L('Шар радиуса','Shar radiusi')} ${3*m}. V = ?`,36*m**3,'π')},
deriv:d=>{const a=R(2,6),n=R(2,4),x=R(1,3);return N(`f(x) = ${a}x${sup(n)},  f′(${x}) = ?`,a*n*x**(n-1))},
integ:d=>{const k=R(1,3+d),a=R(1,3);return N(`∫(0→${k}) ${2*a}x dx = ?`,a*k*k)}};
GEN.rect=d=>{const a=R(3,10*d+5),b=R(2,a),ar=R(0,1);return N(`${L('Прямоугольник','To‘rtburchak')} ${a}×${b}. ${ar?L('Площадь','Yuza'):L('Периметр','Perimetr')} = ?`,ar?a*b:2*(a+b))};
function genQs(c){const pool=T[c.grade].filter((x,i)=>(c.mode=='all'||(c.mode=='geo')==!!x[3])&&(c.topic=='all'||+c.topic==i)),qs=[],seen=new Set();let g=0;while(qs.length<c.n&&g++<400){const x=pool[R(0,pool.length-1)],q=GEN[x[2]](c.d);if(!seen.has(q.q)){seen.add(q.q);qs.push({...q,tp:x[0]})}}return qs}

<div class=g>${['f1','f2','f3','f4','f5','f6'].map((k,i)=>`<div class=card><div class=num>${['7','300+','∞','🏆','📊','📈'][i]}</div>${t(k)}</div>`).join('')}</div>
<div class=card><b>${t('grade')}</b><div class=g style="margin-top:10px">${[5,6,7,8,9,10,11].map(g=>`<button class=s onclick="SU.grade=${g};SU.topic='all';go('setup')">${g} ${t('cl')}</button>`).join('')}</div></div><p class=mu>${t('authn')}</p>`)}

function form(o,pre,g){const tp=T[g].map((x,i)=>[i,tn(x),x[3]]).filter(x=>o.mode=='all'||(o.mode=='geo')==!!x[2]);return `<div class=g><div><label>${t('mode')}</label><select onchange="${pre}.mode=this.value;${pre}.topic='all';go(PG)">${opts([['all',t('amix')],['alg',t('alg')],['geo',t('geom')]],o.mode)}</select></div><div><label>${t('topic')}</label><select onchange="${pre}.topic=this.value">${opts([['all',t('all')],...tp.map(x=>[x[0],x[1]])],o.topic)}</select></div><div><label>${t('diff')}</label><select onchange="${pre}.d=+this.value">${opts([[1,t('d1')],[2,t('d2')],[3,t('d3')]],o.d)}</select></div><div><label>${t('cnt')}</label><input type=number min=1 max=30 value=${o.n} onchange="${pre}.n=Math.min(30,Math.max(1,+this.value||1));this.value=${pre}.n"></div><div><label>${t('pts')}</label><select onchange="${pre}.pts=+this.value">${opts([1,2,3,4].map(x=>[x,x]),o.pts)}</select></div></div>`}

function runFree(){startTest({...SU,name:S.name||'Guest'},r=>{S.hist.unshift({date:Date.now(),grade:r.cfg.grade,pct:r.pct,score:r.score,max:r.max,tp:r.ans.map(a=>a.tp)});S.hist=S.hist.slice(0,300);save();result(r)})}
function startTest(cfg,done){const qs=genQs(cfg);TS={cfg,qs,i:0,score:0,ans:[],t0:Date.now(),done,lock:0};showQ()}
function showQ(){const c=TS.cfg,q=TS.qs[TS.i],n=TS.qs.length,sec=c.grade<7?15:10;TS.lock=0;TS.sec=sec;TS.dl=Date.now()+sec*1000;
V(`<div class=card><div class=row><b>${t('q')} ${TS.i+1}/${n}</b><b>${t('score')}: ${TS.score}/${n*c.pts}</b></div><div class=bar><i style="width:${TS.i/n*100}%"></i></div><div class=ring id=rn><svg viewBox="0 0 120 120"><circle class=tr cx=60 cy=60 r=54 /><circle class=fg id=rg cx=60 cy=60 r=54 stroke-dasharray=339.3 stroke-dashoffset=0 /><text id=rt x=60 y=71>${sec}</text></svg></div><div class=qq>${q.q}</div><div class=g>${q.opts.map((o,k)=>`<button class="opt s" onclick="pick(${k})">${o}</button>`).join('')}</div><br><button class=s onclick="fin()">${t('fin')}</button></div>`);
clearInterval(TS.iv);TS.iv=setInterval(tick,100)}
function tick(){const r=TS.dl-Date.now();if(r<=0)return pick(-1);const g=$('#rg');if(!g)return;g.style.strokeDashoffset=339.3*(1-r/(TS.sec*1000));$('#rt').textContent=Math.ceil(r/1000);$('#rn').classList.toggle('w',r<=3000)}
function pick(k){if(!TS||TS.lock)return;TS.lock=1;clearInterval(TS.iv);const q=TS.qs[TS.i];if(k===q.a)TS.score+=TS.cfg.pts;TS.ans.push({q:q.q,opts:q.opts,a:q.a,k,tp:q.tp});TS.i++;TS.i>=TS.qs.length?endTest():showQ()}
function fin(){if(confirm(t('sure')))endTest()}
function endTest(){clearInterval(TS.iv);if(TS.lock==2)return;TS.lock=2;const n=TS.qs.length,c=TS.cfg,right=TS.ans.filter(a=>a.k===a.a).length,wrong=TS.ans.filter(a=>a.k>=0&&a.k!==a.a).length;TS.done({cfg:c,n,right,wrong,skip:n-right-wrong,score:right*c.pts,max:n*c.pts,pct:Math.round(right/n*100),time:Math.round((Date.now()-TS.t0)/1000),ans:TS.ans})}

V(`<div class=card><h1>${t(lv(r.pct))}</h1><div class=mu>${t('lvn')}</div><div class=g><div><svg viewBox="0 0 120 120" style="max-width:220px">${dn}<text x=60 y=66 text-anchor=middle fill=currentColor font-size=20 font-weight=700>${r.pct}%</text></svg></div><div><p>${t('name')}: <b>${r.cfg.name}</b> · ${r.cfg.grade} ${t('cl')}</p><p><span class=ok>${t('right')}: ${r.right}</span> · <span class=bad>${t('wrong')}: ${r.wrong}</span> · ${t('skip')}: ${r.skip}</p><p>${t('score')}: <b>${r.score} / ${r.max}</b></p><p>${t('time')}: ${r.time} s</p></div></div><div class=g><button onclick="runFree()">${t('rep')}</button><button class=s onclick="rv()">${t('rev')}</button><button class=s onclick="print()">${t('pdf')}</button><button class=s onclick="go('home')">${t('menu')}</button></div><div id=rvw></div></div>`)}

function prof(){const h=S.hist,n=h.length,tp={};h.forEach(x=>(x.tp||[]).forEach(()=>{}));const avg=n?Math.round(h.reduce((s,x)=>s+x.pct,0)/n):0;
V(`<div class=card><h1>👤 ${S.name||'Guest'}</h1><p class=mu>${t('authn')}</p><div class=g><div><div class=num>${n}</div>${t('tests')}</div><div><div class=num>${avg}%</div>${t('avg')}</div><div><div class=num>${n?Math.max(...h.map(x=>x.pct)):0}%</div>${t('best')}</div><div><div class=num>${h.reduce((s,x)=>s+x.score,0)}</div>${t('tot')}</div><div><div class=num>${Math.floor(h.reduce((s,x)=>s+x.score,0)/50)+1}</div>LVL (XP)</div></div></div><div class=card><table>${h.slice(0,10).map(x=>`<tr><td>${new Date(x.date).toLocaleDateString()}</td><td>${x.grade} ${t('cl')}</td><td>${x.score}/${x.max}</td><td>${x.pct}%</td></tr>`).join('')||t('none')}</table></div>`)}

function grp(l){const keys=[...new Set(l.res.map(x=>`${x.score}|${x.pct}`))].sort((a,b)=>{const A=a.split('|').map(Number),B=b.split('|').map(Number);return B[0]-A[0]||B[1]-A[1]}).slice(0,3);return keys.map(k=>{const [s,p]=k.split('|').map(Number);return{s,pct:p,p:l.res.filter(x=>x.score===s&&x.pct===p)}})}
let A=null,vol=.7,mut=false,CT=[];

function runCer(){const G=grp(CL);CT.forEach(clearTimeout);CT=[];if(!G.length){$('#cb').innerHTML=t('none');return}const seq=G.map((_,i)=>i).reverse();seq.forEach((i,k)=>CT.push(setTimeout(()=>{step(G,i);if(k==seq.length-1)CT.push(setTimeout(()=>ctl(1),3200))},k*4500)));$('#cc').innerHTML=''}
function step(G,i){const g=G[i],M=['👑','🥈','🥉'][i],ttl=['CHAMPION OF CLASS 9A','SECOND PLACE','THIRD PLACE'][i],bg=['radial-gradient(ellipse at 50% 15%,#69501b,#11152f 68%)','radial-gradient(circle,#53617d,#0f172a 70%)','radial-gradient(circle,#8b542d,#1c0f05 70%)'][i];$('.bg').style.background=bg;if(i===0)music();
$('#cb').innerHTML=(i==0?`<div class=crown>👑</div><div class=tro>🏆</div>`:`<div class=m>${M}</div>`)+`<h2>${ttl}</h2>`+g.p.map(x=>`<div class=nm>${x.name}<div style="font-size:2.2vw;font-weight:600">${x.score}/${x.max} · ${x.pct}%</div></div>`).join('')+(i==0?`<div style="font-size:1.6vw">${t('cand')}</div>`:'');
if(i==0)for(let k=0;k<45;k++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${R(0,99)}%;background:${['#facc15','#00E5FF','#A855F7','#fff'][k%4]};animation-duration:${R(3,6)}s;animation-delay:${R(0,30)/10}s`;$('#cer').appendChild(c)}}

addEventListener('keydown',e=>{if(e.key=='Escape'){if($('#cer').style.display=='flex'){closeCer();return}}
if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)&&!/INPUT|SELECT/.test(document.activeElement.tagName)){const root=$('#cer').style.display=='flex'?$('#cer'):document,b=[...root.querySelectorAll('button')].filter(x=>x.offsetParent),i=b.indexOf(document.activeElement),f=e.key=='ArrowRight'||e.key=='ArrowDown';(b[(i+(f?1:-1)+b.length)%b.length]||b[0]).focus();e.preventDefault()}});
ap();go('home');
